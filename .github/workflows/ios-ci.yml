name: iOS checks

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "scripts/generate_xcodeproj.rb"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve packages
        working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project ClimateNote.xcodeproj -scheme ClimateNote
      - name: Verify App Store release metadata
        run: |
          ./scripts/static_preflight.sh --ios-only
      - name: Build for simulator
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project ClimateNote.xcodeproj
          -scheme ClimateNote
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify built product is iPhone-only
        run: |
          app_info=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Debug-iphonesimulator/The Climate Note.app/Info.plist' -print -quit)
          test -n "$app_info"
          ./scripts/verify_ios_product.sh "$app_info"
